<!DOCTYPE html>
<html>
<head>
  <title>Verriex Official</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: #0f2027;
    }

    .content {
      position: relative;
      z-index: 1;
      padding-top: 200px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: black;
      margin-top: 20px;
    }

    button:hover {
      transform: scale(1.1);
      transition: 0.3s;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>

<body>

<div id="particles-js"></div>

<div class="content">
  <h1>Welcome To Verriex Website 🔥</h1>
  <p>Website Resmi Saya</p>
  <a href="game.html">
    <button>Main Game 🎮</button>
  </a>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    size: { value: 3 },
    color: { value: "#ffffff" },
    line_linked: { enable: true, color: "#ffffff" },
    move: { speed: 2 }
  }
});
</script>

</body>
</html>
