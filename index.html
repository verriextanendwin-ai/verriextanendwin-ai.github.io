<!DOCTYPE html>
<html>
<head>
  <title>Verriex Official</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(-45deg, #1e3c72, #2a5298, #0f2027, #203a43);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      font-size: 40px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: black;
      margin-top: 20px;
    }

    button:hover {
      transform: scale(1.1);
      transition: 0.3s;
    }
  </style>
</head>

<body>
  <div>
    <h1>Welcome To Verriex Website 🔥</h1>
    <p>Website Resmi Pertama Saya</p>
    <button onclick="alert('Level Up Bro 🚀')">Klik Saya</button>
  </div>
</body>
</html>
