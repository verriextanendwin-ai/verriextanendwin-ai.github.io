<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ffb6d9,#ff69b4,#ff1493);
overflow:hidden;
text-align:center;
color:white;
}

/* LOADING SCREEN */

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#ff1493;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
z-index:9999;
}

/* MAIN */

#main{
display:none;
padding-top:80px;
}

/* CAKE */

.cake{
font-size:120px;
cursor:pointer;
transition:0.3s;
}

.cake:hover{
transform:scale(1.2);
}

/* EMOJI FALL */

.emoji{
position:fixed;
font-size:30px;
animation:fall linear forwards;
}

@keyframes fall{
0%{transform:translateY(-10vh)}
100%{transform:translateY(110vh)}
}

/* FIREWORK CANVAS */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<!-- LOADING -->

<div id="loading">Loading Felicia...</div>

<!-- MAIN -->

<div id="main">

<div class="cake" onclick="celebrate()">🎂</div>

<br><br>

<button onclick="toggleMusic()">🎵 Music</button>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="fireworks"></canvas>

<script>

/* LOADING */

setTimeout(()=>{
document.getElementById("loading").style.display="none"
document.getElementById("main").style.display="block"
},3000)

/* MUSIC */

let music=document.getElementById("music")

function toggleMusic(){
if(music.paused){
music.play()
}else{
music.pause()
}
}

/* EMOJI PARTY */

function celebrate(){

let emojis=["🎉","🎂","💖","✨"]

for(let i=0;i<60;i++){

let e=document.createElement("div")
e.className="emoji"
e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)]

e.style.left=Math.random()*100+"vw"
e.style.animationDuration=(3+Math.random()*3)+"s"

document.body.appendChild(e)

setTimeout(()=>e.remove(),6000)

}

fireworks()

}

/* FIREWORKS */

let canvas=document.getElementById("fireworks")
let ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let particles=[]

function fireworks(){

for(let i=0;i<200;i++){

particles.push({
x:canvas.width/2,
y:canvas.height/2,
vx:(Math.random()-0.5)*14,
vy:(Math.random()-0.5)*14,
life:100
})

}

}

function animate(){

requestAnimationFrame(animate)

ctx.clearRect(0,0,canvas.width,canvas.height)

particles.forEach((p,i)=>{

p.x+=p.vx
p.y+=p.vy
p.life--

ctx.fillStyle="white"
ctx.fillRect(p.x,p.y,3,3)

if(p.life<=0){
particles.splice(i,1)
}

})

}

animate()

</script>

</body>
</html>
